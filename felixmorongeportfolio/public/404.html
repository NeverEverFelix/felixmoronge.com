<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var l = window.location;
        var path = l.pathname + l.search + l.hash;
        l.replace(l.origin + "/?p=" + encodeURIComponent(path));
      })();
    </script>
  </head>
  <body></body>
</html>
